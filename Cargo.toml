[package]
name = "peace-wave"
version = "0.1.0"
edition = "2024"
description = "Rust backend for Peace CLI"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# NOTE: dev-only; ServiceExt::oneshot drives test requests through the router
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
